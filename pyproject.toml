[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tensor-spline"
version = "1.0.0"
description = "Compressed neural network layers — Eisenstein lattice splines and low-rank factorization"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["torch>=2.0"]
authors = [{name = "tensor-spline contributors"}]

[project.urls]
Homepage = "https://github.com/example/tensor-spline"
Repository = "https://github.com/example/tensor-spline"
"Bug Tracker" = "https://github.com/example/tensor-spline/issues"

[project.optional-dependencies]
mesh = ["plato-core>=0.1.0"]

[project.entry-points."superinstance.plugins"]
tensor-spline = "tensor_spline.mesh:register_tensor_spline"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["tensor_spline*"]
exclude = ["tests*"]
